<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CourseHub 视频任务 Fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0b0f19; color: #e6edf7; margin: 0; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      .sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
      .task { border: 1px solid #223049; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #111827; }
      video { width: 480px; max-width: 100%; background: #000; border-radius: 6px; }
      .status { font-size: 12px; margin-top: 8px; font-family: ui-monospace, monospace; color: #6ee7b7; }
    </style>
  </head>
  <body>
    <h1>测试视频任务（本地 fixture · 真实 MP4 / HTML5 &lt;video&gt;）</h1>
    <div class="sub">
      使用 ffmpeg 生成的真实 8 秒 H.264 MP4，可真实观测 duration / currentTime / ended。
      本页不属于任何真实平台，不产生任何学习记录。
    </div>

    <div class="task" data-task="t1" id="task-t1">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>任务 1 · 开场导学（8 秒）</strong>
        <span class="active-badge" id="badge-t1" style="font-size:11px;color:#38bdf8;">[当前激活]</span>
      </div>
      <video id="v1" src="coursehub-test-video.mp4" preload="auto" muted playsinline></video>
      <div class="status" id="s1">state: loading</div>
    </div>

    <div class="task" data-task="t2" id="task-t2">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>任务 2 · 章节小测（8 秒，同素材用于连播验证）</strong>
        <span class="active-badge" id="badge-t2" style="font-size:11px;color:#94a3b8;display:none;">[当前激活]</span>
      </div>
      <video id="v2" src="coursehub-test-video.mp4" preload="auto" muted playsinline></video>
      <div class="status" id="s2">state: loading</div>
    </div>

    <div class="task" style="border-color:#334155;background:#0d1527;">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px;">页面生命周期与焦点观测日志</div>
      <div id="lifecycle-log" style="font-size:12px;font-family:ui-monospace,monospace;color:#94a3b8;max-height:80px;overflow-y:auto;">
        (暂无生命周期事件)
      </div>
    </div>

    <script>
      const tasks = [
        { id: 't1', el: document.getElementById('v1'), status: document.getElementById('s1'), container: document.getElementById('task-t1'), badge: document.getElementById('badge-t1') },
        { id: 't2', el: document.getElementById('v2'), status: document.getElementById('s2'), container: document.getElementById('task-t2'), badge: document.getElementById('badge-t2') }
      ]

      let activeTaskId = 't1'
      const lifecycleEvents = []

      function logLifecycle(name, detail) {
        const time = new Date().toISOString().split('T')[1].replace('Z','')
        const entry = { name, detail, time }
        lifecycleEvents.push(entry)
        window.__chLifecycleEvents = lifecycleEvents
        const logEl = document.getElementById('lifecycle-log')
        if (logEl) {
          logEl.innerHTML = lifecycleEvents.slice(-6).map(e => `<div>[${e.time}] ${e.name}: ${e.detail}</div>`).join('')
        }
      }

      document.addEventListener('visibilitychange', () => {
        logLifecycle('visibilitychange', 'visibilityState=' + document.visibilityState)
      })
      window.addEventListener('blur', () => {
        logLifecycle('window:blur', 'hasFocus=' + document.hasFocus())
      })
      window.addEventListener('focus', () => {
        logLifecycle('window:focus', 'hasFocus=' + document.hasFocus())
      })

      function setActiveTask(id) {
        activeTaskId = id
        window.__chActiveTaskId = id
        for (const t of tasks) {
          if (t.id === id) {
            t.container.style.borderColor = '#0284c7'
            t.badge.style.display = 'inline'
            t.badge.style.color = '#38bdf8'
          } else {
            t.container.style.borderColor = '#223049'
            t.badge.style.display = 'none'
            // 切换非活动任务时暂停其视频
            if (!t.el.paused) t.el.pause()
          }
        }
      }

      function refresh(t) {
        const v = t.el
        const state = v.error
          ? 'error'
          : v.ended
            ? 'ended'
            : v.seeking || (v.readyState >= 2 && v.readyState <= 3 && v.paused)
              ? 'buffering'
              : v.paused
                ? 'paused'
                : 'playing'
        const d = Number.isFinite(v.duration) && v.duration > 0 ? v.duration.toFixed(2) : 'null'
        t.status.textContent =
          'state: ' + state +
          ' | t=' + (v.currentTime || 0).toFixed(2) + '/' + d +
          ' | rate=' + v.playbackRate + ' | vol=' + v.volume.toFixed(2) + ' | muted=' + v.muted
      }

      for (const t of tasks) {
        for (const ev of ['loadedmetadata', 'play', 'pause', 'ended', 'waiting', 'canplay', 'ratechange', 'volumechange', 'error', 'seeked']) {
          t.el.addEventListener(ev, () => {
            refresh(t)
            if (ev === 'ended') {
              window.__chLastEndedTask = t.id
              logLifecycle('media:ended', `taskId=${t.id}`)
            }
          })
        }
      }

      // 供 E2E 与主进程调用
      window.__chTasks = tasks
      window.__chActiveTaskId = activeTaskId
      window.__chSetActiveTask = setActiveTask
      window.__chLifecycleEvents = lifecycleEvents
      window.__chLogLifecycle = logLifecycle
      window.__chRefresh = () => tasks.forEach(refresh)

      let loaded = 0
      for (const t of tasks) {
        if (t.el.readyState >= 1) {
          refresh(t)
          loaded++
        } else {
          t.el.addEventListener('loadedmetadata', () => {
            refresh(t)
            loaded++
            if (loaded === tasks.length) window.__chReady = true
          }, { once: true })
        }
      }
      if (loaded === tasks.length) window.__chReady = true
      setActiveTask('t1')
    </script>
  </body>
</html>
